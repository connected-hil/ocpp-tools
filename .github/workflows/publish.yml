name: Publish Package to npmjs
on:
  release:
    types: [created]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # add Socket Firewall to the runner environment
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: sfw pnpm install
      - name: Set version
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "VERSION=${TAG:v}" >> $GITHUB_ENV
      - name: Bump Version of package.json
        uses: ramonpaolo/bump-version@v2.3.1
        with:
          tag: ${{ env.VERSION }}
          commit: false
      - name: Build
        run: pnpm build
      - name: Publish
        run: |
          TAG=${{ github.event.release.tag_name }}
          cp package.json dist
          cd dist
          if [[ "$TAG" == *"-pre"* ]]; then
            npm publish --access public --no-git-checks --tag next
          else
            npm publish --access public --no-git-checks
          fi
